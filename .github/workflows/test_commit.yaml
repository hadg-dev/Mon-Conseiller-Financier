name: Test on Commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [trigger-training]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        # We tag it with the Commit SHA (for precise versioning) AND 'latest'
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker build -f docker/Dockerfile -t $IMAGE_ID:${{ github.sha }} .
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:latest

      - name: Run Tests in Docker
        # We test the EXACT image we just built. 
        # If this fails, we never push to Docker Hub.
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker run --rm \
            -e MLFLOW_TRACKING_URI="file:///tmp/mlruns" \
            $IMAGE_ID:${{ github.sha }} \
            python -m pytest tests/
