name: Test on Commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [trigger-training]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker build -f docker/Dockerfile -t $IMAGE_ID:${{ github.sha }} .
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:latest

      - name: Run Tests in Docker
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker run --rm \
            -e MLFLOW_TRACKING_URI="file:///tmp/mlruns" \
            $IMAGE_ID:${{ github.sha }} \
            python -m pytest tests/
