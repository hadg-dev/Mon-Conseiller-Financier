name: Continuous Training Pipeline

on:
  # New dataset version : retrain without building the image
  push:
    tags:
      - 'data-v*'
  # Code change : build the image, then train on the newest dataset version
  workflow_dispatch:
      inputs:
        trigger_dag:
          description: 'Trigger the Airflow DAG ?'
          required: false
          type: boolean
          default: true

jobs:
  # ==============================================================================
  # JOB 1: BUILD, TEST & PUSH (The "Artifact Factory")
  # ==============================================================================
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        # We tag it with the Commit SHA (for precise versioning) AND 'latest'
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          # Reuses the layers of the last pushed image, to avoid reinstalling the requirements
          docker build \
            --cache-from $IMAGE_ID:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f docker/Dockerfile \
            -t $IMAGE_ID:${{ github.sha }} .
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:latest

      - name: Run Tests in Docker
        # We test the EXACT image we just built. 
        # If this fails, we never push to Docker Hub.
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker run --rm \
            -e MLFLOW_TRACKING_URI="file:///tmp/mlruns" \
            $IMAGE_ID:${{ github.sha }} \
            python -m pytest tests/

      - name: Push to Docker Hub
        # Only reached if tests passed; the workflow is started manually, from any branch
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/conseiller-financier-training-app
          
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest

  # ==============================================================================
  # JOB 2: TRIGGER AIRFLOW (Optional - if you have the bridge)
  # ==============================================================================
  trigger-airflow:
    needs: build-and-push
    # !cancelled() : otherwise this job is skipped too when the build is skipped
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && needs.build-and-push.result == 'skipped') ||
      (inputs.trigger_dag == true && needs.build-and-push.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # Fetches the tags, to find the newest dataset version
          fetch-depth: 0

      - name: Install Python Dependencies
        run: pip install requests

      - name: Trigger Airflow DAG
        env:
          AIRFLOW_URL: ${{ secrets.AIRFLOW_URL }}
          AIRFLOW_USER: ${{ secrets.AIRFLOW_USERNAME }}
          AIRFLOW_PASS: ${{ secrets.AIRFLOW_PASSWORD }}
          DAG_ID: "github_ec2_ml_training"
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # No image was built for this commit : use the last one, with the pushed dataset version
            IMAGE_TAG=latest
            DATA_VERSION="$REF_NAME"
          else
            IMAGE_TAG="$COMMIT_SHA"
            DATA_VERSION=$(git tag --list 'data-v*' --sort=-version:refname | head -n 1)
          fi

          if [ -z "$DATA_VERSION" ]; then
            echo "::error::No data-v* tag found, push a dataset version first"
            exit 1
          fi

          # Run the python script, passing the image tag and the dataset version as arguments
          python scripts/trigger_airflow.py "$IMAGE_TAG" "$DATA_VERSION"
